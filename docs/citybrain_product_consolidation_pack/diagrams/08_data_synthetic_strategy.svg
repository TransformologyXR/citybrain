<text x="750" y="50" font-family="Inter,Arial" font-size="34" font-weight="700" text-anchor="middle" fill="#0f172a">Dubai / Synthetic Data Strategy</text>
<rect x="95" y="135" width="470" height="110" rx="18" fill="white" stroke="#16a34a" stroke-width="3"/>
