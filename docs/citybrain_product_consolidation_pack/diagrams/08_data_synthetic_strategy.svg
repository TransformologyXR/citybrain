<text x="330" y="523" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#475569">events, statuses, incidents, workloads,</text>
<text x="330" y="541" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#475569">alarms, lead-lag histories</text>
