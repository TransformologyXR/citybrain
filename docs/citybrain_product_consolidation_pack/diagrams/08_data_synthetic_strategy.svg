<text x="330" y="203" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#475569">217 communities, polygons, IDs, roads,</text>
<text x="330" y="221" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#475569">parcels, buildings, Makani when available</text>
