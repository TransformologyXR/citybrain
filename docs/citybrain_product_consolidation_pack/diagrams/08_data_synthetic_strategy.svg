<text x="1195" y="315" font-family="Inter,Arial" font-size="16" text-anchor="middle" fill="#475569">messy departmental projections</text>
<line x1="900" y1="430" x2="980" y2="450" stroke="#64748b" stroke-width="2" marker-end="url(#arrow4)"/>
<rect x="980" y="395" width="430" height="105" rx="18" fill="white" stroke="#dc2626" stroke-width="3"/>
