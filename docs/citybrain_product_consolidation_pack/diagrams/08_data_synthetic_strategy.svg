<text x="1195" y="583" font-family="Inter,Arial" font-size="22" font-weight="700" text-anchor="middle" fill="#7c3aed">Scenario dataset</text>
<text x="1195" y="615" font-family="Inter,Arial" font-size="16" text-anchor="middle" fill="#475569">replayable demos and stress tests</text>
<text x="750" y="815" font-family="Inter,Arial" font-size="17" text-anchor="middle" fill="#475569">The demo should be real where identity matters and synthetic where operational behavior is missing.</text>
