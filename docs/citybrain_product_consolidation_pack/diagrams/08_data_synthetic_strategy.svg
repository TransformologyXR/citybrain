<text x="330" y="333" font-family="Inter,Arial" font-size="22" font-weight="700" text-anchor="middle" fill="#2563eb">Semi-clean source facts</text>
<text x="330" y="363" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#475569">DLD transactions, DM permits/violations,</text>
<text x="330" y="381" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#475569">RTA/DEWA public or sampled records</text>
